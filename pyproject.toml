[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "apmode"
dynamic = ["version"]
description = "Adaptive Pharmacokinetic Model Discovery Engine"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "GPL-2.0-or-later"
authors = [{ name = "Sergey Kornilov", email = "sergey.kornilov@biostochastics.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "lark>=1.2",
    "pydantic>=2.7",
    "pandera>=0.18",
    "sparkid>=0.2",
    "typer>=0.12",
    "structlog>=24.1",
    "numpy>=1.25",
    "pandas>=2.0",
    "rich>=13.0",
    "scipy>=1.11",
    "rocrate>=0.13",
    "pyyaml>=6.0",
    "sympy>=1.12",
]

[project.optional-dependencies]
node = [
    "jax[cpu]>=0.4.30",
    "diffrax>=0.6",
    "equinox>=0.11",
    "optax>=0.2",
    "jaxtyping>=0.2",
]
test = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "syrupy>=4.0",
    "pytest-asyncio>=0.23",
    "pandas>=2.0",
    "jax[cpu]>=0.4.30",
    "diffrax>=0.6",
    "equinox>=0.11",
    "optax>=0.2",
    "jaxtyping>=0.2",
]
llm = [
    "anthropic>=0.39",
    "openai>=1.50",
    "google-genai>=1.0",
    "ollama>=0.4",
    # 1.84.0 patches GHSA-4xpc-pv4p-pm3w (critical: auth bypass via Host
    # header injection) and GHSA-qrc4-49gv-mv9m (high: internal_user can
    # mint API keys outside their role's permitted routes). Lower bound
    # is bumped to the patched release so any ``uv sync --extra llm``
    # resolves to a non-vulnerable wheel.
    "litellm>=1.84.0",
]
bayesian = [
    "cmdstanpy>=1.2",
    "arviz>=0.17",
    "pyarrow>=15.0",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.19",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
apmode = "apmode.__main__:main"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.6.0-rc1"

[tool.hatch.build.hooks.vcs]
version-file = "src/apmode/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/apmode"]

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 99
# _version.py is regenerated on every build by hatch-vcs with an
# unsorted __all__ (RUF022) that would trip ruff on fresh CI checkouts.
extend-exclude = ["src/apmode/_version.py"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "SIM",       # flake8-simplify
    "TCH",       # flake8-type-checking
    "RUF",       # ruff-specific
    "A",         # flake8-builtins (shadowing)
]
ignore = [
    # Typer command callbacks legitimately shadow builtins like ``format``
    # and ``type`` in keyword-argument position; enforcing A002/A003 would
    # require renaming option labels seen by users.
    "A002",
    "A003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TCH001", "TCH003", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["apmode"]

[tool.uv]
# litellm and fastapi hard-pin several transitive dependencies to
# test-time versions that have since picked up their *own* CVE patches.
# The overrides below force the patched releases — APMODE only imports
# ``litellm.acompletion`` (not the proxy CLI / Jinja templating paths
# that litellm pins for) and consumes Starlette only via FastAPI's
# request/response plumbing, so the runtime contract is unaffected.
#
# - ``click>=8.2``          : roc-validator>=0.8.1 needs >=8.2;
#                             litellm pins ==8.1.8.
# - ``aiohttp>=3.14.1``     : clears GHSA-4m7w-qmgq-4wj5 (TLS hostname
#                             override on connection reuse),
#                             GHSA-xcgm-r5h9-7989 (websocket frame
#                             memory-limit bypass), GHSA-63hw-fmq6-xxg2
#                             (max_line_size bypass on fragmented
#                             lines), GHSA-hpj7-wq8m-9hgp (digest-auth
#                             credential leak on cross-origin redirect),
#                             GHSA-4fvr-rgm6-gqmc (unbounded pipelined
#                             request queue), GHSA-9x8q-7h8h-wcw9
#                             (unclosed payload on mid-body disconnect),
#                             GHSA-g3cq-j2xw-wf74 (client_max_size
#                             bypass via unread compressed body),
#                             GHSA-m6qw-4cw2-hm4m (CRLF injection in
#                             multipart headers), and
#                             GHSA-2fqr-mr3j-6wp8 (host-only cookies
#                             promoted to domain cookies); litellm pins
#                             ==3.13.3.
# - ``python-dotenv>=1.2.2``: clears the symlink-follow CVE in
#                             set_key; litellm pins ==1.0.1.
# - ``msgpack>=1.2.1``      : clears GHSA-6v7p-g79w-8964 (out-of-bounds
#                             read / crash on Unpacker reuse after a
#                             caught error).
# - ``starlette>=1.3.1``    : clears GHSA-82w8-qh3p-5jfq (silently
#                             ignored form-data size limits enabling
#                             DoS), GHSA-jp82-jpqv-5vv3 (unvalidated
#                             path poisons request.url.hostname),
#                             GHSA-wqp7-x3pw-xc5r (SSRF/NTLM credential
#                             theft via UNC paths in StaticFiles on
#                             Windows), GHSA-x746-7m8f-x49c (arbitrary
#                             HTTP method dispatch via getattr on
#                             HTTPEndpoint), and GHSA-86qp-5c8j-p5mr
#                             (missing Host header validation poisons
#                             request.url.path); fastapi pins an older
#                             floor.
# - ``cryptography>=48.0.1``: clears GHSA-537c-gmf6-5ccf (vulnerable
#                             OpenSSL bundled in prior wheels).
# - ``idna>=3.15``          : clears GHSA-65pc-fj4g-8rjx (crafted input
#                             to idna.encode() bypasses the
#                             CVE-2024-3651 fix).
# - ``urllib3>=2.7.0``      : clears GHSA-qccp-gfcp-xxvc (sensitive
#                             headers forwarded cross-origin on proxied
#                             redirects) and GHSA-mf9v-mfxr-j63j
#                             (decompression-bomb safeguard bypass in
#                             the streaming API).
# - ``pip>=26.1``           : clears GHSA-jp4c-xjxw-mgf9 (concatenated
#                             tar/ZIP interpretation conflict,
#                             CVE-2026-3219). pip is dev-only
#                             here — pulled in transitively via
#                             ``pip-audit -> pip-api -> pip`` in
#                             ``[project.optional-dependencies].dev``;
#                             APMODE never invokes pip at runtime, users
#                             install via ``uv sync``.
override-dependencies = [
    "click>=8.2",
    "aiohttp>=3.14.1",
    "python-dotenv>=1.2.2",
    "msgpack>=1.2.1",
    "starlette>=1.3.1",
    "cryptography>=48.0.1",
    "idna>=3.15",
    "urllib3>=2.7.0",
    "pip>=26.1",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sparkid.*", "pandera.*", "lark.*", "jax.*", "jaxlib.*", "diffrax.*", "equinox.*", "optax.*", "jaxtyping.*", "pandas.*", "cmdstanpy.*", "arviz.*", "pyarrow.*", "scipy.*", "aiosqlite.*", "yaml.*", "shellingham.*", "sympy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "live: marks tests that call live LLM APIs (deselect with '-m \"not live\"')",
    "requires_r: needs a real Rscript + R package (nlmixr2/mice/...)",
    "requires_llm: needs a live LLM provider SDK + key",
]
filterwarnings = [
    "ignore:os.fork\\(\\) was called.*JAX is multithreaded:RuntimeWarning",
]

[dependency-groups]
dev = [
    "roc-validator>=0.8.1",
]
